workflows:
  qarzmanager-android:
    name: QarzManager Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle
        script: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

      - name: Build debug APK
        script: |
          /tmp/gradle/gradle-8.9/bin/gradle assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
